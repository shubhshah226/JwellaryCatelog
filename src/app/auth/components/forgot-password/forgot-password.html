<div class="login-page">
  <div class="login-bg">
    <div class="login-bg-left" aria-hidden="true"></div>
    <div class="login-bg-right" aria-hidden="true"></div>
  </div>

  <div class="login-card">
    <div class="card-glow" aria-hidden="true"></div>

    <header class="card-header">
      <div class="logo">
        <i class="fa-solid fa-key" aria-hidden="true"></i>
      </div>
      <h1 class="brand-title">CATALOG</h1>
      <p class="brand-subtitle">MANAGEMENT SYSTEM</p>
    </header>

    <div class="welcome-section">
      <h2 class="welcome-title">Forgot password</h2>
      <p class="welcome-subtitle">Enter your account email and we’ll send a reset link.</p>
    </div>

    @if (linkSent()) {
      <p class="login-success" role="status">Check your email for the reset link.</p>
      <a routerLink="/login" class="login-btn" style="text-decoration: none; margin-top: 1rem">
        Back to login
        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
      </a>
    } @else {
      <form class="login-form" (ngSubmit)="submit()">
        <div class="input-group">
          <span class="input-icon" aria-hidden="true">
            <i class="fa-solid fa-envelope"></i>
          </span>
          <input
            type="email"
            name="email"
            placeholder="Email"
            [(ngModel)]="email"
            autocomplete="email"
            required
          />
        </div>

        @if (errorMessage()) {
          <p class="login-error" role="alert">{{ errorMessage() }}</p>
        }

        <button type="submit" class="login-btn" [disabled]="isLoading()">
          {{ isLoading() ? 'Sending…' : 'Send reset link' }}
          <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
        </button>
      </form>
    }

    <p class="login-hint">
      <a routerLink="/login" class="login-home-link">Back to login</a>
    </p>
  </div>
</div>
