<div class="login-page">
  <div class="login-bg">
    <div class="login-bg-left" aria-hidden="true"></div>
    <div class="login-bg-right" aria-hidden="true"></div>
  </div>

  <div class="login-card">
    <div class="card-glow" aria-hidden="true"></div>

    <header class="card-header">
      <div class="logo">
        <i class="fa-solid fa-lock" aria-hidden="true"></i>
      </div>
      <h1 class="brand-title">CATALOG</h1>
      <p class="brand-subtitle">MANAGEMENT SYSTEM</p>
    </header>

    <div class="welcome-section">
      <h2 class="welcome-title">Set new password</h2>
      <p class="welcome-subtitle">Choose a new password for your account.</p>
    </div>

    @if (tokenMissing()) {
      <p class="login-error" role="alert">This reset link is invalid or incomplete.</p>
      <a routerLink="/forgot-password" class="login-btn" style="text-decoration: none; margin-top: 1rem">
        Request reset link
      </a>
    } @else {
      <form class="login-form" (ngSubmit)="submit()">
        <div class="input-group">
          <span class="input-icon" aria-hidden="true">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="newPassword"
            placeholder="New password"
            [(ngModel)]="newPassword"
            autocomplete="new-password"
            required
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.data-tooltip]="showPassword ? 'Hide password' : 'Show password'"
          >
            @if (showPassword) {
              <i class="fa-solid fa-eye-slash"></i>
            } @else {
              <i class="fa-solid fa-eye"></i>
            }
          </button>
        </div>

        <div class="input-group">
          <span class="input-icon" aria-hidden="true">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input
            [type]="showConfirm ? 'text' : 'password'"
            name="confirmPassword"
            placeholder="Confirm password"
            [(ngModel)]="confirmPassword"
            autocomplete="new-password"
            required
          />
          <button
            type="button"
            class="toggle-password"
            (click)="toggleConfirm()"
            [attr.aria-label]="showConfirm ? 'Hide password' : 'Show password'"
            [attr.data-tooltip]="showConfirm ? 'Hide password' : 'Show password'"
          >
            @if (showConfirm) {
              <i class="fa-solid fa-eye-slash"></i>
            } @else {
              <i class="fa-solid fa-eye"></i>
            }
          </button>
        </div>

        @if (errorMessage()) {
          <p class="login-error" role="alert">{{ errorMessage() }}</p>
        }

        <button type="submit" class="login-btn" [disabled]="isLoading()">
          {{ isLoading() ? 'Saving…' : 'Reset password' }}
          <i class="fa-solid fa-check" aria-hidden="true"></i>
        </button>
      </form>
    }

    <p class="login-hint">
      <a routerLink="/login" class="login-home-link">Back to login</a>
    </p>
  </div>
</div>
