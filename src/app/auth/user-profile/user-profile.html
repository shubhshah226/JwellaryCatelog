<section class="user-profile-page">
  <div class="page-header">
    <h2>User Profile</h2>
    <p>Your account details from the platform.</p>
  </div>

  @if (isLoading()) {
    <div class="state-message">
      <div class="page-loader-ring" aria-hidden="true"></div>
      <p>Loading profile...</p>
    </div>
  } @else if (loadFailed()) {
    <div class="state-message error">
      <p>Unable to load profile.</p>
      <button type="button" class="retry-btn" (click)="loadProfile()">Retry</button>
    </div>
  } @else if (profile(); as p) {
    <form class="profile-card" (submit)="$event.preventDefault()">
      <div class="field-grid">
        <label class="field">
          <span>Full Name</span>
          <input type="text" [value]="p.fullName || '—'" readonly />
        </label>

        <label class="field">
          <span>Email</span>
          <input type="email" [value]="p.email || '—'" readonly />
        </label>

        <label class="field">
          <span>User Role</span>
          <input type="text" [value]="formatRole(p.userRole)" readonly />
        </label>

        <label class="field">
          <span>Account Status</span>
          <input type="text" [value]="formatStatus(p.accountStatus)" readonly />
        </label>

        <label class="field">
          <span>User ID</span>
          <input type="text" [value]="p.userId || '—'" readonly />
        </label>

        <label class="field">
          <span>Tenant ID</span>
          <input type="text" [value]="p.tenantId || '—'" readonly />
        </label>

        <label class="field">
          <span>Business Name</span>
          <input type="text" [value]="p.businessName || '—'" readonly />
        </label>

        <label class="field">
          <span>Last Login</span>
          <input type="text" [value]="formatLastLogin(p.lastLoginAt)" readonly />
        </label>
      </div>
    </form>
  }
</section>
