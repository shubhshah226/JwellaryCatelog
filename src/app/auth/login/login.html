<div class="login-page">
  <div class="login-bg">
    <div class="login-bg-left" aria-hidden="true">
      <i class="fa-solid fa-gem bg-icon bg-icon-left-1"></i>
      <i class="fa-solid fa-diamond bg-icon bg-icon-left-2"></i>
      <i class="fa-solid fa-gem bg-icon bg-icon-left-3"></i>
    </div>

    <div class="login-bg-right" aria-hidden="true">
      <i class="fa-solid fa-gem bg-icon bg-icon-1"></i>
      <i class="fa-solid fa-diamond bg-icon bg-icon-2"></i>
      <i class="fa-solid fa-gem bg-icon bg-icon-3"></i>
      <i class="fa-solid fa-diamond bg-icon bg-icon-4"></i>
      <i class="fa-solid fa-gem bg-icon bg-icon-5"></i>
    </div>
  </div>

  <div class="login-card">
    <div class="card-glow" aria-hidden="true"></div>

    <header class="card-header">
      <div class="logo">
        <i class="fa-solid fa-diamond" aria-hidden="true"></i>
      </div>
      <h1 class="brand-title">CATALOG</h1>
      <p class="brand-subtitle">MANAGEMENT SYSTEM</p>
    </header>

    <div class="welcome-section">
      <h2 class="welcome-title">
        Welcome <span class="gradient-text">Back</span>
      </h2>
      <p class="welcome-subtitle">Login to continue to your account</p>
    </div>

    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="input-group">
        <span class="input-icon" aria-hidden="true">
          <i class="fa-solid fa-user"></i>
        </span>
        <input
          type="text"
          name="email"
          placeholder="Email"
          [(ngModel)]="email"
          autocomplete="Email"
          required
        />
      </div>

      <div class="input-group">
        <span class="input-icon" aria-hidden="true">
          <i class="fa-solid fa-lock"></i>
        </span>
        <input
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          placeholder="Password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
        />
        <button
          type="button"
          class="toggle-password"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          @if (showPassword) {
            <i class="fa-solid fa-eye-slash"></i>
          } @else {
            <i class="fa-solid fa-eye"></i>
          }
        </button>
      </div>

      <div class="form-options">
        <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
      </div>

      @if (errorMessage()) {
        <p class="login-error" role="alert">{{ errorMessage() }}</p>
      }

      <button type="submit" class="login-btn" [disabled]="isLoading()">
        {{ isLoading() ? 'Signing in...' : 'Login' }}
        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
      </button>
    </form>

    <p class="login-hint">
      Admin and vendor accounts are created by the platform administrator.
      <a routerLink="/" class="login-home-link">Back to home</a>
    </p>
  </div>
</div>
