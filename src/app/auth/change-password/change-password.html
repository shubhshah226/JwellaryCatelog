<section class="change-password-page">
  <div class="page-header">
    <h2>Change Password</h2>
  </div>

  <form class="password-card" (ngSubmit)="submit()">
    <label class="field">
      <span>Current Password <em>*</em></span>
      <div class="input-wrap">
        <input
          [type]="showCurrent ? 'text' : 'password'"
          name="currentPassword"
          [(ngModel)]="currentPassword"
          autocomplete="current-password"
          required
        />
        <button
          type="button"
          class="toggle"
          (click)="showCurrent = !showCurrent"
          [attr.aria-label]="showCurrent ? 'Hide current password' : 'Show current password'"
        >
          <i class="fa-solid" [class.fa-eye]="!showCurrent" [class.fa-eye-slash]="showCurrent"></i>
        </button>
      </div>
    </label>

    <label class="field">
      <span>New Password <em>*</em></span>
      <div class="input-wrap">
        <input
          [type]="showNew ? 'text' : 'password'"
          name="newPassword"
          [(ngModel)]="newPassword"
          autocomplete="new-password"
          required
        />
        <button
          type="button"
          class="toggle"
          (click)="showNew = !showNew"
          [attr.aria-label]="showNew ? 'Hide new password' : 'Show new password'"
        >
          <i class="fa-solid" [class.fa-eye]="!showNew" [class.fa-eye-slash]="showNew"></i>
        </button>
      </div>
    </label>

    <label class="field">
      <span>Confirm New Password <em>*</em></span>
      <div class="input-wrap">
        <input
          [type]="showConfirm ? 'text' : 'password'"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
          required
        />
        <button
          type="button"
          class="toggle"
          (click)="showConfirm = !showConfirm"
          [attr.aria-label]="showConfirm ? 'Hide confirm password' : 'Show confirm password'"
        >
          <i class="fa-solid" [class.fa-eye]="!showConfirm" [class.fa-eye-slash]="showConfirm"></i>
        </button>
      </div>
    </label>

    @if (errorMessage()) {
      <p class="message error" role="alert">{{ errorMessage() }}</p>
    }
    @if (successMessage()) {
      <p class="message success" role="status">{{ successMessage() }}</p>
    }

    <button type="submit" class="submit-btn" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Updating...' : 'Update Password' }}
    </button>
  </form>
</section>
