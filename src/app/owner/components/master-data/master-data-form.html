@if (isLoading()) {
  <div class="state-message">
    <div class="page-loader-ring" aria-hidden="true"></div>
    <span>Loading...</span>
  </div>
} @else if (pageError()) {
  <div class="state-message error">
    <p>{{ pageError() }}</p>
    <button type="button" class="btn btn-outline" (click)="goBack()">Back to Product Options</button>
  </div>
} @else {
  <section class="master-form-page">
    <div class="mf-toolbar">
      <button type="button" class="mf-back" (click)="goBack()" [disabled]="isSubmitting()" aria-label="Back">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back</span>
      </button>
    </div>

    <header class="mf-heading">
      <h2>{{ pageTitle() }}</h2>
      <p>{{ pageHelp() }}</p>
    </header>

    <form class="mf-form" (ngSubmit)="submit()">
      <section class="mf-card">
        <div class="form-row">
          <label class="form-field form-field-span2">
            <span>{{ entityLabel() }} name <em>*</em></span>
            <input
              type="text"
              [(ngModel)]="formName"
              name="masterName"
              [placeholder]="placeholder()"
              required
              autofocus
            />
          </label>

          @if (type() === 'categories') {
            <label class="form-field">
              <span>Parent category</span>
              <select [(ngModel)]="formParentId" name="parentId">
                <option value="">None — top level</option>
                @for (parent of parentOptions(); track parent.id) {
                  <option [value]="parent.id">{{ parent.name }}</option>
                }
              </select>
              <small class="field-hint">
                Use a parent to create a sub-category (e.g. Wedding under Ring).
              </small>
            </label>

            <label class="form-field">
              <span>Display order</span>
              <input
                type="number"
                name="sortOrder"
                min="0"
                [(ngModel)]="formSortOrder"
                placeholder="1"
              />
              <small class="field-hint">
                Lower numbers show first. Each order number must be unique.
              </small>
            </label>
          }

          <label class="form-field">
            <span>Status</span>
            <select [(ngModel)]="formStatus" name="masterStatus">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </label>
        </div>
      </section>

      @if (formError()) {
        <p class="form-error mf-error">{{ formError() }}</p>
      }

      <div class="mf-footer">
        <button type="button" class="btn btn-outline" (click)="goBack()" [disabled]="isSubmitting()">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Saving...' : (mode() === 'edit' ? 'Update' : 'Save') }}
          {{ entityLabel() }}
        </button>
      </div>
    </form>
  </section>
}
