@if (isLoading()) {
  <div class="state-message">
    <div class="page-loader-ring" aria-hidden="true"></div>
    <span>Loading...</span>
  </div>
} @else if (pageError()) {
  <div class="state-message error">
    <p>{{ pageError() }}</p>
    <button type="button" class="btn btn-outline" (click)="goBack()">Back to Master Data</button>
  </div>
} @else {
  <section class="master-form-page">
    <div class="mf-toolbar">
      <button type="button" class="mf-back" (click)="goBack()" [disabled]="isSubmitting()" aria-label="Back">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back</span>
      </button>
    </div>

    <form class="mf-form" (ngSubmit)="submit()">
      <section class="mf-card">
        <div class="form-row">
          <label class="form-field form-field-span2">
            <span>{{ entityLabel() }} Name <em>*</em></span>
            <input
              type="text"
              [(ngModel)]="formName"
              name="masterName"
              [placeholder]="placeholder()"
              required
              autofocus
            />
          </label>

          <label class="form-field">
            <span>Status</span>
            <select [(ngModel)]="formStatus" name="masterStatus">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </label>
        </div>
      </section>

      @if (formError()) {
        <p class="form-error mf-error">{{ formError() }}</p>
      }

      <div class="mf-footer">
        <button type="button" class="btn btn-outline" (click)="goBack()" [disabled]="isSubmitting()">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Saving...' : (mode() === 'edit' ? 'Update' : 'Save') }} {{ entityLabel() }}
        </button>
      </div>
    </form>
  </section>
}
